<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Banner Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .page-wrap {
            width: 100%;
            max-width: 1000px;
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            color: #333;
            margin-bottom: 20px;
        }

        /* 입력 필드 영역 */
        .fields {
            display: grid;
            grid-template-columns: 1fr 2fr 4fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 13px;
            color: #666;
        }

        .field-group input {
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .field-group input:focus {
            border-color: #5a7a8c;
        }

        /* 배너 영역 */
        .banner-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: context-menu;
        }

        .banner-wrapper:hover .hover-hint {
            opacity: 1;
        }

        .hover-hint {
            position: absolute;
            bottom: 12px;
            right: 14px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #banner {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #d4c5a9 0%, #9ca3a4 50%, #5a7a8c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.1) 0%, transparent 60%);
        }

        .header-content {
            text-align: center;
            z-index: 2;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
        }

        .company-name {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: white;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 1px;
            color: white;
            margin: 0;
        }

        /* 우클릭 컨텍스트 메뉴 */
        .ctx-menu {
            position: fixed;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            z-index: 9999;
            overflow: hidden;
            min-width: 180px;
            display: none;
        }

        .ctx-item {
            padding: 11px 16px;
            font-size: 14px;
            cursor: pointer;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }

        .ctx-item:hover {
            background: #f5f5f5;
        }

        .ctx-sep {
            height: 1px;
            background: #eee;
        }

        /* 토스트 알림 */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 9px 22px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="page-wrap">
        <h2>LinkedIn Banner Editor</h2>

        <!-- 입력 필드 -->
        <div class="fields">
            <div class="field-group">
                <label>로고 텍스트</label>
                <input id="inp-logo" type="text" value="SH" maxlength="4" placeholder="SH">
            </div>
            <div class="field-group">
                <label>이름</label>
                <input id="inp-name" type="text" value="Sehee Ku" placeholder="Your Name">
            </div>
            <div class="field-group">
                <label>태그라인</label>
                <input id="inp-tag" type="text" value="Oracle Eloqua & Salesforce Marketing Cloud Expert" placeholder="Your tagline">
            </div>
        </div>

        <!-- 배너 미리보기 -->
        <div class="banner-wrapper" id="banner-wrapper">
            <div id="banner">
                <div class="header-content">
                    <div class="logo" id="el-logo">SH</div>
                    <h1 class="company-name" id="el-name">Sehee Ku</h1>
                    <p class="tagline" id="el-tag">Oracle Eloqua & Salesforce Marketing Cloud Expert</p>
                </div>
            </div>
            <span class="hover-hint">우클릭으로 저장 / 복사</span>
        </div>
    </div>

    <!-- 우클릭 메뉴 -->
    <div class="ctx-menu" id="ctx-menu">
        <div class="ctx-item" id="ctx-download">⬇ PNG로 다운로드</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" id="ctx-copy">📋 클립보드에 복사</div>
    </div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

    <script>
        // 실시간 입력 반영
        document.getElementById('inp-logo').addEventListener('input', e => {
            document.getElementById('el-logo').textContent = e.target.value;
        });
        document.getElementById('inp-name').addEventListener('input', e => {
            document.getElementById('el-name').textContent = e.target.value;
        });
        document.getElementById('inp-tag').addEventListener('input', e => {
            document.getElementById('el-tag').textContent = e.target.value;
        });

        // 토스트 메시지
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 2200);
        }

        // html2canvas로 배너 캡처
        function captureBanner(callback) {
            html2canvas(document.getElementById('banner'), {
                scale: 3,
                useCORS: true,
                backgroundColor: null
            }).then(callback);
        }

        // 우클릭 메뉴 표시
        const menu = document.getElementById('ctx-menu');
        const wrapper = document.getElementById('banner-wrapper');

        wrapper.addEventListener('contextmenu', e => {
            e.preventDefault();
            menu.style.display = 'block';
            menu.style.left = Math.min(e.clientX, window.innerWidth - 190) + 'px';
            menu.style.top = Math.min(e.clientY, window.innerHeight - 110) + 'px';
        });

        document.addEventListener('click', () => menu.style.display = 'none');

        // PNG 다운로드
        document.getElementById('ctx-download').addEventListener('click', () => {
            menu.style.display = 'none';
            captureBanner(canvas => {
                const a = document.createElement('a');
                a.download = 'linkedin-banner.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
                showToast('PNG 다운로드 완료!');
            });
        });

        // 클립보드 복사
        document.getElementById('ctx-copy').addEventListener('click', () => {
            menu.style.display = 'none';
            captureBanner(canvas => {
                canvas.toBlob(blob => {
                    try {
                        navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        showToast('클립보드에 복사되었어요!');
                    } catch (err) {
                        showToast('복사 실패 — 브라우저 권한을 확인해주세요');
                    }
                });
            });
        });
    </script>
</body>
</html>
